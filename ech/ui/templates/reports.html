<style>
:root {
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2230;--border:#30363d;--border2:#444c56;
  --text:#e6edf3;--muted:#8b949e;--dim:#484f58;
  --green:#3fb950;--yellow:#d29922;--red:#f85149;--blue:#388bfd;--purple:#a371f7;
  --mono:'IBM Plex Mono','Cascadia Code','Consolas','Liberation Mono',monospace;--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px}
#sim-banner{display:none;position:fixed;top:0;left:0;right:0;height:26px;background:#431407;border-bottom:2px solid #c2410c;color:#fb923c;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-align:center;line-height:24px;z-index:2000;text-transform:uppercase}
body.sim-mode #sim-banner{display:block}
body.sim-mode{padding-top:26px}
body.sim-mode #reports-container{height:calc(100vh - 186px)}

#header{display:flex;align-items:center;gap:16px;padding:0 20px;height:48px;
  background:var(--bg2);border-bottom:1px solid var(--border)}
.logo{font-family:var(--mono);font-size:13px;color:var(--green);letter-spacing:.08em}
.back-link{font-family:var(--mono);font-size:11px;color:var(--blue);text-decoration:none}
.back-link:hover{text-decoration:underline}
.spacer{flex:1}
#clock{font-family:var(--mono);font-size:12px;color:var(--muted)}

#toolbar{display:flex;align-items:center;gap:10px;padding:10px 20px;flex-wrap:wrap;
  border-bottom:1px solid var(--border);background:var(--bg2)}
#search-box{background:var(--bg);border:1px solid var(--border);color:var(--text);
  font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:4px;outline:none;width:220px}
#search-box:focus{border-color:var(--blue)}
.action-btn{font-family:var(--mono);font-size:11px;padding:4px 12px;border-radius:4px;
  cursor:pointer;border:1px solid;background:var(--bg3);border-color:var(--border);color:var(--muted)}
.action-btn:hover{border-color:var(--blue);color:var(--blue)}
.filter-btn{font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:4px;
  border:1px solid var(--border);background:var(--bg3);color:var(--muted);cursor:pointer}
.filter-btn.active{border-color:var(--blue);color:var(--blue)}
.filter-sep{width:1px;background:var(--border);align-self:stretch;margin:0 4px}
.summary-bar{display:flex;gap:16px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--bg)}
.summary-item{font-family:var(--mono);font-size:11px;color:var(--muted)}
.summary-item span{font-weight:500;color:var(--text)}

#reports-container{overflow-y:auto;height:calc(100vh - 160px);padding:12px 20px}
#reports-container::-webkit-scrollbar{width:4px}
#reports-container::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

.report-card{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--blue);
  border-radius:8px;margin-bottom:8px;overflow:hidden;transition:border-color .15s}
.report-card:hover{border-color:var(--border2)}
.report-card.kind-strip{border-left-color:var(--purple)}
.report-card.report-new{border-left-color:var(--green)}
.report-card.report-done{opacity:.7}

.report-header{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.kind-badge{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:3px;letter-spacing:.05em}
.kind-badge.skywarn{background:rgba(56,139,253,.12);border:1px solid var(--blue);color:var(--blue)}
.kind-badge.strip{background:rgba(163,113,247,.12);border:1px solid var(--purple);color:var(--purple)}
.report-title{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--text)}
.report-tag{font-family:var(--mono);font-size:10px;background:var(--bg3);
  padding:2px 6px;border-radius:3px;color:var(--muted)}
.report-loc{font-family:var(--mono);font-size:11px;color:var(--blue);text-decoration:none}
.report-loc:hover{text-decoration:underline}
.report-status-done{font-family:var(--mono);font-size:10px;background:rgba(63,185,80,.12);
  border:1px solid var(--green);padding:2px 6px;border-radius:3px;color:var(--green)}
.report-status-open{font-family:var(--mono);font-size:10px;background:rgba(210,153,34,.12);
  border:1px solid var(--yellow);padding:2px 6px;border-radius:3px;color:var(--yellow)}
.report-ts{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:auto}
.report-summary{padding:0 14px 8px;font-family:var(--mono);font-size:11px;color:var(--text)}

.report-fields{background:var(--bg3);border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  padding:10px 14px;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.8;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 16px}
.field-key{color:var(--dim)}
.field-val{color:var(--text)}
.field-val input{background:var(--bg);border:1px solid var(--border2);color:var(--text);
  font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:3px;width:100%;outline:none}
.field-val input:focus{border-color:var(--blue)}

.report-actions{display:flex;gap:8px;padding:8px 14px 10px}
.action-sm{font-family:var(--mono);font-size:10px;padding:3px 10px;border-radius:3px;
  border:1px solid;cursor:pointer;transition:all .1s;background:var(--bg)}
.edit-btn{border-color:var(--blue);color:var(--blue)}
.edit-btn:hover{background:rgba(56,139,253,.15)}
.done-btn{border-color:var(--green);color:var(--green)}
.done-btn:hover{background:rgba(63,185,80,.15)}
.undone-btn{border-color:var(--border2);color:var(--muted)}
.undone-btn:hover{border-color:var(--yellow);color:var(--yellow)}
.del-btn{border-color:var(--red);color:var(--red)}
.del-btn:hover{background:rgba(248,81,73,.15)}
.save-btn{border-color:var(--green);color:var(--green)}
.save-btn:hover{background:rgba(63,185,80,.15)}
.cancel-btn{border-color:var(--border2);color:var(--muted)}
.cancel-btn:hover{border-color:var(--red);color:var(--red)}

.empty-state{text-align:center;padding:60px 20px;font-family:var(--mono);
  font-size:13px;color:var(--dim)}
.empty-state .icon{font-size:36px;margin-bottom:12px}

#toast-area{position:fixed;bottom:16px;right:20px;display:flex;flex-direction:column;gap:6px;z-index:99}
.toast{font-family:var(--mono);font-size:11px;padding:8px 14px;border-radius:4px;
  background:var(--bg3);border:1px solid var(--border2);color:var(--text);
  animation:slideIn .2s ease}
.toast.ok{border-left:3px solid var(--green)}
.toast.err{border-left:3px solid var(--red)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div id="sim-banner">&#9888; SIMULATION MODE — FOR TRAINING USE ONLY &#9888;</div>
<div id="header">
  <a class="back-link" href="/">← SM</a>
  <div class="logo">▣ SM / Reports</div>
  <div class="spacer"></div>
  <div id="clock"></div>
</div>

<div id="toolbar">
  <button class="filter-btn active" data-filter-kind="all" onclick="setKindFilter('all',this)">All</button>
  <button class="filter-btn" data-filter-kind="skywarn" onclick="setKindFilter('skywarn',this)">🌦 SKYWARN</button>
  <button class="filter-btn" data-filter-kind="strip" onclick="setKindFilter('strip',this)">📋 Strip</button>
  <div class="filter-sep"></div>
  <button class="filter-btn active" data-filter-status="all" onclick="setStatusFilter('all',this)">Any status</button>
  <button class="filter-btn" data-filter-status="open" onclick="setStatusFilter('open',this)">Open</button>
  <button class="filter-btn" data-filter-status="done" onclick="setStatusFilter('done',this)">Done/Sent</button>
  <input type="text" id="search-box" placeholder="Filter…" oninput="renderReports()">
  <div class="spacer"></div>
  <button class="action-btn" onclick="loadReports()">↻ Refresh</button>
</div>

<div class="summary-bar">
  <div class="summary-item">Total on file: <span id="cnt-total">0</span></div>
  <div class="summary-item" style="margin-left:auto">SKYWARN reports are logged locally only — never auto-submitted to NWS. Strip reports are sent via Winlink when the mesh bot's guided form completes.</div>
</div>

<div id="reports-container">
  <div class="empty-state" id="empty-state" style="display:none">
    <div class="icon">📄</div>
    No reports on file yet
  </div>
  <div id="reports-list"></div>
</div>

<div id="toast-area"></div>

<script>
let skywarnReports = [];
let stripReports = [];
let newIds = new Set();
let editingKey = null;   // `${kind}:${id}`
let kindFilter = 'all';
let statusFilter = 'all';

const SKYWARN_FIELDS = [
  ['callsign',   'Callsign'],
  ['spotter_id', 'Spotter ID'],
  ['location',   'Location'],
  ['event_type', 'Event type'],
  ['temp_f',     'Temp (F)'],
  ['wind_mph',   'Wind (mph)'],
  ['wind_dir',   'Wind dir'],
  ['hail_size',  'Hail (in)'],
  ['precip',     'Precip'],
  ['notes',      'Notes'],
];

// ── Clock ──────────────────────────────────────────────────────────────
function tick() {
  document.getElementById('clock').textContent =
    new Date().toUTCString().slice(17,25) + ' UTC';
}
setInterval(tick, 1000); tick();

// ── Data load ────────────────────────────────────────────────────────────
async function loadReports() {
  try {
    const [swRes, stRes] = await Promise.all([
      fetch('/api/skywarn?limit=500').then(r => r.json()).catch(() => ({reports:[]})),
      fetch('/api/strip_reports?limit=500').then(r => r.json()).catch(() => ({reports:[]})),
    ]);
    skywarnReports = swRes.reports || [];
    stripReports = stRes.reports || [];
    document.getElementById('cnt-total').textContent = skywarnReports.length + stripReports.length;
    renderReports();
  } catch(e) {
    toast('Failed to load reports', 'err');
  }
}

function mergedReports() {
  const sw = skywarnReports.map(r => ({...r, kind: 'skywarn'}));
  const st = stripReports.map(r => ({...r, kind: 'strip'}));
  return [...sw, ...st].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
}

// ── Filter & render ──────────────────────────────────────────────────────
function setKindFilter(kind, el) {
  kindFilter = kind;
  el.parentElement.querySelectorAll('[data-filter-kind]').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderReports();
}
function setStatusFilter(status, el) {
  statusFilter = status;
  el.parentElement.querySelectorAll('[data-filter-status]').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderReports();
}

function isDone(r) {
  return r.kind === 'skywarn' ? !!r.completed : !!r.sent;
}

function renderReports() {
  const search = document.getElementById('search-box').value.toLowerCase();
  let filtered = mergedReports();

  if (kindFilter !== 'all') filtered = filtered.filter(r => r.kind === kindFilter);
  if (statusFilter === 'open') filtered = filtered.filter(r => !isDone(r));
  else if (statusFilter === 'done') filtered = filtered.filter(r => isDone(r));

  if (search) {
    filtered = filtered.filter(r => {
      const vals = r.kind === 'strip' ? Object.values(r.answers || {}) : Object.values(r);
      return [r.from_display, r.callsign, r.template, r.raw_text, ...vals]
        .join(' ').toLowerCase().includes(search);
    });
  }

  const container = document.getElementById('reports-list');
  const empty = document.getElementById('empty-state');

  if (filtered.length === 0) {
    container.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';
  container.innerHTML = filtered.map(buildCard).join('');
}

function buildCard(r) {
  const key = `${r.kind}:${r.id}`;
  const ts = new Date(r.timestamp).toUTCString().slice(5,25);
  const isNew = newIds.has(key) ? ' report-new' : '';
  const done = isDone(r);
  const doneClass = done ? ' report-done' : '';
  const isEditing = editingKey === key;
  const kindBadge = r.kind === 'strip'
    ? `<span class="kind-badge strip">📋 STRIP</span>`
    : `<span class="kind-badge skywarn">🌦 SKYWARN</span>`;
  const title = r.kind === 'strip' ? esc(r.template || 'custom') : esc(r.callsign || '?');
  const fromTag = `<span class="report-tag">${esc(r.from_display || r.from_id || '')}</span>`;
  let loc = '';
  if (r.kind === 'strip' && r.lat != null && r.lon != null) {
    loc = `<a class="report-loc" href="/map?lat=${r.lat}&lon=${r.lon}&zoom=14" target="_blank" rel="noopener">📍 ${r.lat.toFixed(4)}, ${r.lon.toFixed(4)}</a>`;
  } else if (r.kind === 'skywarn' && r.location) {
    loc = `<span class="report-loc">📍 ${esc(r.location)}</span>`;
  }
  const statusTag = done
    ? `<span class="report-status-done">✓ ${r.kind === 'strip' ? ('Sent' + (r.winlink_dest ? ' → ' + esc(r.winlink_dest) : '')) : 'Complete'}</span>`
    : `<span class="report-status-open">⏳ ${r.kind === 'strip' ? 'Pending' : 'Open'}</span>`;

  let fieldRows, summary = '';
  if (r.kind === 'strip') {
    const shown = [['Adapter', r.adapter, null], ...Object.entries(r.answers || {}).map(([k,v]) => [k, v, k])];
    fieldRows = shown.map(([label, val, key2]) => {
      const display = key2 && isEditing
        ? `<input type="text" data-field="${escAttr(key2)}" value="${escAttr(val || '')}">`
        : esc(val || '—');
      return `<div><span class="field-key">${esc(label)}: </span><span class="field-val">${display}</span></div>`;
    }).join('');
  } else {
    summary = `<div class="report-summary">${esc(r.raw_text || '')}</div>`;
    const shown = [['Adapter', r.adapter, null], ['Channel', r.source_channel, null],
      ...SKYWARN_FIELDS.map(([k,label]) => [label, r[k], k])];
    fieldRows = shown.map(([label, val, key2]) => {
      const display = key2 && isEditing
        ? `<input type="text" data-field="${key2}" value="${escAttr(val || '')}">`
        : esc(val || '—');
      return `<div><span class="field-key">${esc(label)}: </span><span class="field-val">${display}</span></div>`;
    }).join('');
  }

  const actions = isEditing
    ? `<button class="action-sm save-btn" onclick="saveEdit('${r.kind}',${r.id})">💾 Save</button>
       <button class="action-sm cancel-btn" onclick="cancelEdit()">✕ Cancel</button>`
    : `<button class="action-sm edit-btn" onclick="startEdit('${r.kind}',${r.id})">✎ Edit</button>
       ${done
         ? `<button class="action-sm undone-btn" onclick="setDone('${r.kind}',${r.id}, false)">↺ Reopen</button>`
         : `<button class="action-sm done-btn" onclick="setDone('${r.kind}',${r.id}, true)">✓ ${r.kind === 'strip' ? 'Mark sent' : 'Complete'}</button>`}
       <button class="action-sm del-btn" onclick="deleteReport('${r.kind}',${r.id})">🗑 Delete</button>`;

  return `<div class="report-card kind-${r.kind}${isNew}${doneClass}" id="card-${key}">
    <div class="report-header">
      ${kindBadge}
      <span class="report-title">${title}</span>
      ${fromTag}
      ${loc}
      ${statusTag}
      <span class="report-ts">${ts}</span>
    </div>
    ${summary}
    <div class="report-fields">${fieldRows}</div>
    <div class="report-actions">${actions}</div>
  </div>`;
}

// ── Edit ───────────────────────────────────────────────────────────────
function startEdit(kind, id) {
  editingKey = `${kind}:${id}`;
  renderReports();
}
function cancelEdit() {
  editingKey = null;
  renderReports();
}

async function saveEdit(kind, id) {
  const card = document.getElementById(`card-${kind}:${id}`);
  const fields = {};
  card.querySelectorAll('input[data-field]').forEach(inp => { fields[inp.dataset.field] = inp.value; });
  try {
    const url = kind === 'strip' ? `/api/strip_reports/${id}` : `/api/skywarn/${id}`;
    const body = kind === 'strip' ? {answers: fields} : fields;
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    const d = await r.json();
    if (d.status === 'ok') {
      if (kind === 'strip') {
        const idx = stripReports.findIndex(x => x.id === id);
        if (idx >= 0) stripReports[idx] = d.report;
      } else {
        const idx = skywarnReports.findIndex(x => x.id === id);
        if (idx >= 0) skywarnReports[idx] = d.report;
      }
      editingKey = null;
      toast('Report updated', 'ok');
      renderReports();
    } else {
      toast('Update failed', 'err');
    }
  } catch(e) {
    toast('Update failed', 'err');
  }
}

// ── Done/sent toggle & delete ─────────────────────────────────────────────
async function setDone(kind, id, done) {
  try {
    const url = kind === 'strip' ? `/api/strip_reports/${id}/sent` : `/api/skywarn/${id}/complete`;
    const body = kind === 'strip' ? {sent: done} : {completed: done};
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    const d = await r.json();
    if (d.status === 'ok') {
      if (kind === 'strip') {
        const idx = stripReports.findIndex(x => x.id === id);
        if (idx >= 0) stripReports[idx] = d.report;
      } else {
        const idx = skywarnReports.findIndex(x => x.id === id);
        if (idx >= 0) skywarnReports[idx] = d.report;
      }
      toast(done ? 'Marked done' : 'Reopened', 'ok');
      renderReports();
    } else {
      toast('Action failed', 'err');
    }
  } catch(e) {
    toast('Action failed', 'err');
  }
}

async function deleteReport(kind, id) {
  if (!confirm('Delete this report? This cannot be undone.')) return;
  try {
    const url = kind === 'strip' ? `/api/strip_reports/${id}` : `/api/skywarn/${id}`;
    const r = await fetch(url, {method:'DELETE'});
    const d = await r.json();
    if (d.status === 'ok') {
      if (kind === 'strip') stripReports = stripReports.filter(x => x.id !== id);
      else skywarnReports = skywarnReports.filter(x => x.id !== id);
      document.getElementById('cnt-total').textContent = skywarnReports.length + stripReports.length;
      toast('Report deleted', 'ok');
      renderReports();
    } else {
      toast('Delete failed', 'err');
    }
  } catch(e) {
    toast('Delete failed', 'err');
  }
}

// ── WebSocket new-report feed ────────────────────────────────────────────
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.onmessage = (e) => {
    const pkt = JSON.parse(e.data);
    if (pkt.type === 'skywarn_report') {
      newIds.add(`skywarn:${pkt.data.id}`);
      loadReports();
      toast(`🌦 New SKYWARN report: ${pkt.data.callsign}${pkt.data.location ? ' — ' + pkt.data.location : ''}`, 'ok');
    } else if (pkt.type === 'strip_report') {
      newIds.add(`strip:${pkt.data.id}`);
      loadReports();
      toast(`📋 New strip report: ${pkt.data.template || 'custom'} from ${pkt.data.from_display || ''}`, 'ok');
    }
  };
  ws.onclose = () => setTimeout(connectWS, 3000);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return esc(s).replace(/"/g,'&quot;');
}
function toast(msg, type='') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-area').appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

// ── Init ───────────────────────────────────────────────────────────────
loadReports();
setInterval(loadReports, 30000);
connectWS();
if (window.ECH_SIM) document.body.classList.add('sim-mode');
</script>
