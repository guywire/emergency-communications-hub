<style>
:root {
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2230;--border:#30363d;--border2:#444c56;
  --text:#e6edf3;--muted:#8b949e;--dim:#484f58;
  --green:#3fb950;--yellow:#d29922;--red:#f85149;--blue:#388bfd;
  --mono:'IBM Plex Mono','Cascadia Code','Consolas','Liberation Mono',monospace;--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px}
#sim-banner{display:none;position:fixed;top:0;left:0;right:0;height:26px;background:#431407;border-bottom:2px solid #c2410c;color:#fb923c;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-align:center;line-height:24px;z-index:2000;text-transform:uppercase}
body.sim-mode #sim-banner{display:block}
body.sim-mode{padding-top:26px}
body.sim-mode #reports-container{height:calc(100vh - 186px)}

#header{display:flex;align-items:center;gap:16px;padding:0 20px;height:48px;
  background:var(--bg2);border-bottom:1px solid var(--border)}
.logo{font-family:var(--mono);font-size:13px;color:var(--green);letter-spacing:.08em}
.back-link{font-family:var(--mono);font-size:11px;color:var(--blue);text-decoration:none}
.back-link:hover{text-decoration:underline}
.spacer{flex:1}
#clock{font-family:var(--mono);font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:10px;min-width:24px}
.badge-new{background:rgba(63,185,80,.15);color:var(--green);border:1px solid var(--green)}

#toolbar{display:flex;align-items:center;gap:10px;padding:10px 20px;
  border-bottom:1px solid var(--border);background:var(--bg2)}
#search-box{background:var(--bg);border:1px solid var(--border);color:var(--text);
  font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:4px;outline:none;width:240px}
#search-box:focus{border-color:var(--blue)}
.action-btn{font-family:var(--mono);font-size:11px;padding:4px 12px;border-radius:4px;
  cursor:pointer;border:1px solid;background:var(--bg3);border-color:var(--border);color:var(--muted)}
.action-btn:hover{border-color:var(--blue);color:var(--blue)}
.summary-bar{display:flex;gap:16px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--bg)}
.summary-item{font-family:var(--mono);font-size:11px;color:var(--muted)}
.summary-item span{font-weight:500;color:var(--text)}

#reports-container{overflow-y:auto;height:calc(100vh - 160px);padding:12px 20px}
#reports-container::-webkit-scrollbar{width:4px}
#reports-container::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

.report-card{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--blue);
  border-radius:8px;margin-bottom:8px;overflow:hidden;transition:border-color .15s}
.report-card:hover{border-color:var(--border2)}
.report-card.report-new{border-left-color:var(--green)}
.report-card.report-completed{border-left-color:var(--green);opacity:.6}

.report-header{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.report-callsign{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--text)}
.report-spotter{font-family:var(--mono);font-size:10px;background:var(--bg3);
  padding:2px 6px;border-radius:3px;color:var(--muted)}
.report-event{font-family:var(--mono);font-size:10px;background:rgba(210,153,34,.12);
  border:1px solid var(--yellow);padding:2px 6px;border-radius:3px;color:var(--yellow)}
.report-loc{font-family:var(--mono);font-size:11px;color:var(--blue)}
.report-done-tag{font-family:var(--mono);font-size:10px;background:rgba(63,185,80,.12);
  border:1px solid var(--green);padding:2px 6px;border-radius:3px;color:var(--green)}
.report-ts{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:auto}

.report-fields{background:var(--bg3);border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  padding:10px 14px;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.8;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:2px 16px}
.field-key{color:var(--dim)}
.field-val{color:var(--text)}
.field-val input{background:var(--bg);border:1px solid var(--border2);color:var(--text);
  font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:3px;width:100%;outline:none}
.field-val input:focus{border-color:var(--blue)}

.report-actions{display:flex;gap:8px;padding:8px 14px 10px}

.action-sm{font-family:var(--mono);font-size:10px;padding:3px 10px;border-radius:3px;
  border:1px solid;cursor:pointer;transition:all .1s;background:var(--bg)}
.edit-btn{border-color:var(--blue);color:var(--blue)}
.edit-btn:hover{background:rgba(56,139,253,.15)}
.done-btn{border-color:var(--green);color:var(--green)}
.done-btn:hover{background:rgba(63,185,80,.15)}
.undone-btn{border-color:var(--border2);color:var(--muted)}
.undone-btn:hover{border-color:var(--yellow);color:var(--yellow)}
.del-btn{border-color:var(--red);color:var(--red)}
.del-btn:hover{background:rgba(248,81,73,.15)}
.save-btn{border-color:var(--green);color:var(--green)}
.save-btn:hover{background:rgba(63,185,80,.15)}
.cancel-btn{border-color:var(--border2);color:var(--muted)}
.cancel-btn:hover{border-color:var(--red);color:var(--red)}
.filter-btn{font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:4px;
  border:1px solid var(--border);background:var(--bg3);color:var(--muted);cursor:pointer}
.filter-btn.active{border-color:var(--blue);color:var(--blue)}

.empty-state{text-align:center;padding:60px 20px;font-family:var(--mono);
  font-size:13px;color:var(--dim)}
.empty-state .icon{font-size:36px;margin-bottom:12px}

#toast-area{position:fixed;bottom:16px;right:20px;display:flex;flex-direction:column;gap:6px;z-index:99}
.toast{font-family:var(--mono);font-size:11px;padding:8px 14px;border-radius:4px;
  background:var(--bg3);border:1px solid var(--border2);color:var(--text);
  animation:slideIn .2s ease}
.toast.ok{border-left:3px solid var(--green)}
.toast.err{border-left:3px solid var(--red)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div id="sim-banner">&#9888; SIMULATION MODE — FOR TRAINING USE ONLY &#9888;</div>
<div id="header">
  <a class="back-link" href="/">← SM</a>
  <div class="logo">▣ SM / SKYWARN Reports</div>
  <div class="spacer"></div>
  <div id="clock"></div>
</div>

<div id="toolbar">
  <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">All</button>
  <button class="filter-btn" data-filter="open" onclick="setFilter('open',this)">Open</button>
  <button class="filter-btn" data-filter="completed" onclick="setFilter('completed',this)">Completed</button>
  <input type="text" id="search-box" placeholder="Filter by callsign, location, sender…" oninput="renderReports()">
  <div class="spacer"></div>
  <button class="action-btn" onclick="loadReports()">↻ Refresh</button>
</div>

<div class="summary-bar">
  <div class="summary-item">Total on file: <span id="cnt-total">0</span></div>
  <div class="summary-item" style="margin-left:auto">These are logged locally only — never auto-submitted to NWS. Use "skywarn net"/"inws"/"winlink" from the bot to relay one.</div>
</div>

<div id="reports-container">
  <div class="empty-state" id="empty-state" style="display:none">
    <div class="icon">☁</div>
    No SKYWARN reports on file yet
  </div>
  <div id="reports-list"></div>
</div>

<div id="toast-area"></div>

<script>
let allReports = [];
let newIds = new Set();
let editingId = null;
let currentFilter = 'all';

const EDITABLE_FIELDS = [
  ['callsign',   'Callsign'],
  ['spotter_id', 'Spotter ID'],
  ['location',   'Location'],
  ['event_type', 'Event type'],
  ['temp_f',     'Temp (F)'],
  ['wind_mph',   'Wind (mph)'],
  ['wind_dir',   'Wind dir'],
  ['hail_size',  'Hail (in)'],
  ['precip',     'Precip'],
  ['notes',      'Notes'],
];

// ── Clock ──────────────────────────────────────────────────────────────
function tick() {
  document.getElementById('clock').textContent =
    new Date().toUTCString().slice(17,25) + ' UTC';
}
setInterval(tick, 1000); tick();

// ── Data load ────────────────────────────────────────────────────────────
async function loadReports() {
  try {
    const r = await fetch('/api/skywarn?limit=500');
    const data = await r.json();
    allReports = data.reports;
    document.getElementById('cnt-total').textContent = data.total;
    renderReports();
  } catch(e) {
    toast('Failed to load reports', 'err');
  }
}

// ── Filter & render ──────────────────────────────────────────────────────
function setFilter(filter, el) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderReports();
}

function renderReports() {
  const search = document.getElementById('search-box').value.toLowerCase();
  let filtered = allReports;

  if (currentFilter === 'open') filtered = filtered.filter(r => !r.completed);
  else if (currentFilter === 'completed') filtered = filtered.filter(r => r.completed);

  if (search) {
    filtered = filtered.filter(r =>
      ((r.callsign||'') + (r.location||'') + (r.from_display||'') + (r.raw_text||'')).toLowerCase().includes(search)
    );
  }

  const container = document.getElementById('reports-list');
  const empty = document.getElementById('empty-state');

  if (filtered.length === 0) {
    container.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';
  container.innerHTML = filtered.map(buildCard).join('');
}

function buildCard(r) {
  const ts = new Date(r.timestamp).toUTCString().slice(5,25);
  const isNew = newIds.has(r.id) ? ' report-new' : '';
  const isDone = r.completed ? ' report-completed' : '';
  const isEditing = editingId === r.id;
  const spotterBadge = (r.spotter_id && r.spotter_id.toLowerCase() !== 'none')
    ? `<span class="report-spotter">Spotter #${esc(r.spotter_id)}</span>` : '';
  const eventBadge = (r.event_type && r.event_type.toLowerCase() !== 'none')
    ? `<span class="report-event">${esc(r.event_type)}</span>` : '';
  const loc = r.location ? `<span class="report-loc">📍 ${esc(r.location)}</span>` : '';
  const doneTag = r.completed ? `<span class="report-done-tag">✓ Complete</span>` : '';

  // Always show the structured fields directly (field: value), not collapsed —
  // and swap values for inputs when this card is in edit mode.
  const shown = [
    ['From',        r.from_display || r.from_id, null],
    ['Adapter',     r.adapter, null],
    ['Channel',     r.source_channel, null],
    ...EDITABLE_FIELDS.slice(0).map(([key,label]) => [label, r[key], key]),
  ];
  const fieldRows = shown.map(([label, val, key]) => {
    const display = key && isEditing
      ? `<input type="text" data-field="${key}" value="${escAttr(val || '')}">`
      : esc(val || '—');
    return `<div><span class="field-key">${esc(label)}: </span><span class="field-val">${display}</span></div>`;
  }).join('');

  const actions = isEditing
    ? `<button class="action-sm save-btn" onclick="saveEdit(${r.id})">💾 Save</button>
       <button class="action-sm cancel-btn" onclick="cancelEdit()">✕ Cancel</button>`
    : `<button class="action-sm edit-btn" onclick="startEdit(${r.id})">✎ Edit</button>
       ${r.completed
         ? `<button class="action-sm undone-btn" onclick="setCompleted(${r.id}, false)">↺ Reopen</button>`
         : `<button class="action-sm done-btn" onclick="setCompleted(${r.id}, true)">✓ Complete</button>`}
       <button class="action-sm del-btn" onclick="deleteReport(${r.id})">🗑 Delete</button>`;

  return `<div class="report-card${isNew}${isDone}" id="card-${r.id}">
    <div class="report-header">
      <span class="report-callsign">${esc(r.callsign)}</span>
      ${spotterBadge}
      ${eventBadge}
      ${loc}
      ${doneTag}
      <span class="report-ts">${ts}</span>
    </div>
    <div class="report-summary">${esc(r.raw_text)}</div>
    <div class="report-fields">${fieldRows}</div>
    <div class="report-actions">${actions}</div>
  </div>`;
}

// ── Edit ───────────────────────────────────────────────────────────────
function startEdit(id) {
  editingId = id;
  renderReports();
}

function cancelEdit() {
  editingId = null;
  renderReports();
}

async function saveEdit(id) {
  const card = document.getElementById(`card-${id}`);
  const fields = {};
  card.querySelectorAll('input[data-field]').forEach(inp => { fields[inp.dataset.field] = inp.value; });
  try {
    const r = await fetch(`/api/skywarn/${id}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(fields)});
    const d = await r.json();
    if (d.status === 'ok') {
      const idx = allReports.findIndex(x => x.id === id);
      if (idx >= 0) allReports[idx] = d.report;
      editingId = null;
      toast('Report updated', 'ok');
      renderReports();
    } else {
      toast('Update failed', 'err');
    }
  } catch(e) {
    toast('Update failed', 'err');
  }
}

// ── Complete / delete ────────────────────────────────────────────────────
async function setCompleted(id, completed) {
  try {
    const r = await fetch(`/api/skywarn/${id}/complete`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({completed})});
    const d = await r.json();
    if (d.status === 'ok') {
      const idx = allReports.findIndex(x => x.id === id);
      if (idx >= 0) allReports[idx] = d.report;
      toast(completed ? 'Marked complete' : 'Reopened', 'ok');
      renderReports();
    } else {
      toast('Action failed', 'err');
    }
  } catch(e) {
    toast('Action failed', 'err');
  }
}

async function deleteReport(id) {
  if (!confirm('Delete this SKYWARN report? This cannot be undone.')) return;
  try {
    const r = await fetch(`/api/skywarn/${id}`, {method:'DELETE'});
    const d = await r.json();
    if (d.status === 'ok') {
      allReports = allReports.filter(x => x.id !== id);
      document.getElementById('cnt-total').textContent = allReports.length;
      toast('Report deleted', 'ok');
      renderReports();
    } else {
      toast('Delete failed', 'err');
    }
  } catch(e) {
    toast('Delete failed', 'err');
  }
}

// ── WebSocket new-report feed ────────────────────────────────────────────
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.onmessage = (e) => {
    const pkt = JSON.parse(e.data);
    if (pkt.type === 'skywarn_report') {
      allReports.unshift(pkt.data);
      newIds.add(pkt.data.id);
      document.getElementById('cnt-total').textContent = allReports.length;
      renderReports();
      toast(`☁ New SKYWARN report: ${pkt.data.callsign}${pkt.data.location ? ' — ' + pkt.data.location : ''}`, 'ok');
    }
  };
  ws.onclose = () => setTimeout(connectWS, 3000);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function escAttr(s) {
  return esc(s).replace(/"/g,'&quot;');
}

function toast(msg, type='') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-area').appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

// ── Init ───────────────────────────────────────────────────────────────
loadReports();
setInterval(loadReports, 30000);
connectWS();
if (window.ECH_SIM) document.body.classList.add('sim-mode');
</script>
</body>
</html>
