# SignalMatrix
# Reference configuration file.
#
# Deployment:
#   - First install:  copied automatically to /etc/ech/config.yaml
#   - Subsequent:     /etc/ech/config.yaml is PRESERVED (not overwritten by deploy)
#   - Secrets:        keep /etc/ech/config.yaml out of git; this file uses N0CALL placeholders only

# ── Server ────────────────────────────────────────────────────────────────────
server:
  host: "0.0.0.0"
  port: 8765
  # secure_cookies: true    # enable when ECH is behind HTTPS (nginx/caddy reverse proxy)
  # base_path: "/ech"       # set this if reverse-proxied under a sub-path instead of a
                             # dedicated host/port at "/" (e.g. Caddy's `handle_path /ech/*`,
                             # which strips the prefix before forwarding here) — without it,
                             # every hardcoded /api/... fetch, WebSocket, and link in the UI
                             # breaks the moment the app isn't actually living at the proxy's
                             # root. Leading slash, no trailing slash. Leave unset/empty for
                             # the normal dedicated-host/port setup.

database:
  path: "ech.db"

# ── Message retention ────────────────────────────────────────────────────────
# Delete messages from the DB older than the specified hours per adapter prefix.
# Key is matched as a prefix against source_adapter (case-insensitive).
# Set enabled: false to disable all automatic purging.
retention:
  enabled: true
  aprs: 12          # APRS/AIS messages older than 12 hours
  meshcore: 36      # MeshCore messages older than 36 hours
  meshtastic: 36    # Meshtastic messages older than 36 hours
  archive_days: 30  # purged messages are archived to <db_dir>/message_archive/*.jsonl
                     # (restorable) before deletion; archive files older than this are
                     # deleted for good

# ── TLS / HTTPS (optional) ────────────────────────────────────────────────────
# Enables HTTPS so Web Serial CAT works from any browser on the LAN.
# The server generates a self-signed CA cert once (data_dir/ech-ca.crt).
# Operators download and trust that CA cert once; all future ECH deployments
# (any IP) are then trusted automatically — ideal for contest sites where
# the IP changes each event.
#
# Setup:
#   1. Set enabled: true, restart ECH.
#   2. Browse to http://<ip>:8765/ca.crt and trust the CA in your OS/browser.
#   3. Connect to https://<ip>:8443 — Ham Log now shows "🔌 Connect Radio".
#   4. Optional: install zeroconf  (pip install zeroconf)  for ech.local mDNS.
#
# NOTE: port 8766 is reserved for the simulation instance (ech-sim.service).
#       Use 8443 (or any other free port) for HTTPS.
#
# tls:
#   enabled: false
#   https_port: 8443        # HTTPS port alongside HTTP on 8765 (NOT 8766 — sim uses that)
#   data_dir: "."           # where ech-ca.crt/key and ech-server.crt/key live

# ── System GPS (optional) ─────────────────────────────────────────────────────
# Reads NMEA sentences from a serial GPS receiver (e.g. ublox) and feeds
# the position to all adapters as the ECH base location.
# When a fix is acquired the base_lat/base_lon updates automatically —
# APRS beacons, mock node positions, and map centering all follow.
#
# gps:
#   port: /dev/ttyAMA0       # serial port (Pi UART) or /dev/ttyUSB1 for USB
#   baud: 9600               # ublox default; some units use 115200
#   time_sync: true          # set system clock from GPS UTC (requires sudo)
#   update_interval: 30      # seconds between location updates to ECH state
#   min_satellites: 4        # minimum sats required for a valid fix

logging:
  level: "INFO"

operator:
  callsign: "N0CALL"          # replace with your callsign on the server

# ── PSKReporter ───────────────────────────────────────────────────────────────
# PSKReporter's API TOS requires a real contact email in the User-Agent header.
# Without it their infrastructure returns 503.  Set this to your email address.
pskreporter:
  contact_email: ""           # e.g. "you@example.com" — required for API access

# ── Ham Radio Log ─────────────────────────────────────────────────────────────
# Multi-station contest logging with ADIF/Cabrillo/POTA/SOTA export and
# live upload to QRZ.com, Club Log, POTA, and SOTA.
#
# hamlog:
#   callsign: "W1ABC"              # club or station callsign for log header
#   operator: "W1ABC"             # primary operator callsign
#   grid: "FN42"                  # Maidenhead grid square
#   power: "LOW"                  # LOW / HIGH / QRP
#   contest: "ARRL-FIELD-DAY"     # default contest: ARRL-FIELD-DAY, POTA, SOTA, GENERAL
#
#   # ARRL Field Day specific
#   field_day_class: "2A"         # e.g. 1A, 2A, 3A ... 1B, 2B ... 1E etc.
#   field_day_section: "ME"       # ARRL/RAC section abbreviation
#
#   # POTA (Parks on the Air)
#   pota_ref: "K-0001"            # park reference number
#
#   # SOTA (Summits on the Air)
#   sota_ref: "W1/EM-001"         # summit reference
#
#   # Live upload credentials (keep in /etc/ech/config.yaml, not git)
#   qrz_api_key: ""               # QRZ.com XML plan logbook API key
#   clublog_api_key: ""           # Club Log API key
#   clublog_email: ""             # Club Log account email
#   pota_username: ""             # pota.app username
#   pota_password: ""             # pota.app password
#   sota_username: ""             # sota.org username
#   sota_password: ""             # sota.org password
  name: "SM Operator"

incident:
  name: "EXERCISE"

# ── Adapters ──────────────────────────────────────────────────────────────────
#
# Mock adapters (simulated traffic — for dev/demo):
#   mock_meshtastic  mock_aprs  mock_meshcore  mock_js8call  mock_sms  mock_pat_winlink
#
# Real adapters (live hardware):
#   meshtastic       aprs_kiss  aprs_is        meshcore      js8call   sms  pat_winlink
#   mqtt             reticulum  aredn_ami       asterisk      adsb     ax25_bbs  opensky

adapters:

# ── Live adapters — uncomment and fill in for your hardware ──────────────────
# For a simulation-only demo instance, use config-sim.yaml (port 8766) instead.

# ── ADS-B (FlightAware PiAware / dump1090) ───────────────────────────────────
#   - type: adsb
#     name: adsb
#     host: 192.168.6.5       # FlightAware / PiAware device IP
#     port: 80                # HTTP port (default 80)
#     # path: /skyaware/data/aircraft.json   # auto-detected if omitted
#     poll_interval: 10       # seconds between polls (default 10)
#     stale_sec: 120          # remove aircraft not seen for this long (default 120)

# ── OpenSky Network (global ADS-B via public REST API) ───────────────────────
#   Complements the local dump1090/PiAware feed above with wide-area coverage.
#   Anonymous access works but is heavily rate-limited (poll_interval floored
#   at 300s). For faster polling, register a free account at
#   opensky-network.org and create an API client (Account -> API Client).
#   - type: opensky
#     name: opensky
#     bbox: [[43.0, -72.0], [47.0, -65.0]]   # [min_lat, min_lon], [max_lat, max_lon]
#     # client_id: "YOUR_CLIENT_ID"          # optional — raises the rate limit
#     # client_secret: "YOUR_CLIENT_SECRET"
#     poll_interval: 30       # seconds (default 30 if authenticated, floored at 300 if not)
#     stale_sec: 750          # remove aircraft not seen for this long — must comfortably
#                              # exceed poll_interval or aircraft vanish between polls
#                              # (default: max(120, poll_interval * 2.5))

# ── AISstream.io (global AIS via WebSocket — supplements local AIS-catcher) ──
#   Free API key: https://aisstream.io/authenticate
#   - type: aisstream
#     name: aisstream
#     api_key: "YOUR_API_KEY"
#     bounding_box: [[43.0, -72.0], [47.0, -65.0]]   # [min_lat, min_lon], [max_lat, max_lon]
#     stale_sec: 600       # drop vessels not heard for 10 min (default)
#     reconnect_delay: 10  # seconds before reconnecting on drop

# ── AISHub (global AIS via REST poll — free account at aishub.net) ──────────
#   Polls once per poll_interval (minimum 300s on free tier).
#   - type: aishub
#     name: aishub
#     username: "YOUR_AISHUB_USERNAME"
#     bounding_box: [[43.0, -72.0], [47.0, -65.0]]   # [min_lat, min_lon], [max_lat, max_lon]
#     poll_interval: 300   # seconds between polls (default 300)
#     stale_sec: 900       # drop vessels not heard for 15 min (default)

# ── AIS (AIS-catcher receiver) ───────────────────────────────────────────────
#   - type: ais_catcher
#     name: ais
#     host: 192.168.6.5       # AIS-catcher device IP
#     port: 8100              # AIS-catcher HTTP port (default 8100)
#     # path: /vessels.json   # auto-detected if omitted
#     poll_interval: 30       # seconds between polls (default 30)
#     stale_sec: 300          # remove vessels not seen for this long (default 300 = 5min)

# ── MeshCore (real hardware) ──────────────────────────────────────────────────
#
# Serial (USB direct — companion firmware has no ASCII CLI over serial, so the
# private key is NOT auto-retrieved. Export it from the MeshCore app: Settings
# > Manage Identity Key > copy private key, then set private_key: below, OR add
# a paired mqtt/letsmesh adapter's own private_key: for MQTT auth):
#   - type: meshcore
#     name: meshcore
#     transport: serial
#     port: auto               # auto-detect; or specify e.g. /dev/ttyUSB0 / COM3
#     baud: 115200
#     channel_idx: 0           # 0 = public/default channel
#     channel_name: "TAC-1"    # optional: switch to named channel at startup
#     poll_interval: 2.0
#     app_name: SM
#     node_ttl_hours: 48       # keep named nodes on the map/node list this long after
#                              # last heard (default 24h; hex-only unnamed nodes always
#                              # expire after 15 min)
#     online_window_min: 120   # node shows as "online" (full-opacity marker) if heard
#                              # within this window (default 120; MeshCore adverts are
#                              # infrequent, so the 15-min default used for Meshtastic
#                              # would render nearly every node as stale)
#     trace_hash_bytes: 1      # hash width for OUR trace probes (1/2/4; default 1 =
#                              # the ecosystem convention — collisions are handled at
#                              # name-resolution time by recency weighting)
#     # NOTE: 'path.hash.mode' is a REPEATER-only CLI setting (ASCII CLI, not the
#     # companion binary protocol) and does nothing on a companion device — MeshCore's
#     # own docs say companion path-hash width is only configurable via the mobile
#     # app's Experimental Settings, not from ECH/serial. Confirmed by direct probe
#     # (2026-08-02): zero response to any ASCII CLI command over serial to this
#     # companion, even right after a hardware power cycle.
#     max_hops: 0              # outgoing message hop limit (0 = device default; 3 = local mesh).
#     channel_keys:            # optional: per-channel PSKs for decrypting received messages.
#       - idx: 0               #   channel index (0 = Public)
#         key: "AQ=="          #   base64 OR 32-hex-char key. "AQ==" is the MeshCore/Meshtastic default PSK.
#       - idx: 1               #   all default hashtag channels share the same public PSK
#         key: "AQ=="
#       - idx: 2
#         key: "AQ=="
#       - idx: 3
#         key: "AQ=="
#
# WiFi/TCP (node's built-in TCP companion server, default port 4403):
#   NOTE: TCP mode cannot auto-retrieve the private key.
#         Get it once via serial console: run 'get prv.key' and copy the 128-hex output.
#         Put it in private_key under the LetsMesh MQTT adapter below.
#   - type: meshcore
#     name: meshcore
#     transport: tcp
#     host: 192.168.1.50       # node IP
#     tcp_port: 4403
#     channel_idx: 0
#     contact_path_size: 64    # set to 3 for 3-byte path hashing
#     poll_interval: 2.0

# ── MQTT adapters ─────────────────────────────────────────────────────────────
#
# Each [[mqtt]] entry is a separate broker connection.
# Brokers receive and/or publish messages depending on configured topics.
#
# ── LetsMesh (community MeshCore MQTT network) ────────────────────────────────
# Auth uses the MeshCore device's Ed25519 hardware key (JWT scheme from meshcoretomqtt).
# If MeshCore transport is SERIAL: private key is auto-retrieved at startup — no config needed.
# If MeshCore transport is TCP:    paste the key from 'get prv.key' on the serial console.
# GitHub: https://github.com/Cisien/meshcoretomqtt  (auth scheme reference)
#
#   - type: mqtt
#     name: letsmesh-us
#     host: mqtt-us-v1.letsmesh.net
#     port: 443
#     tls: true
#     transport: websockets
#     pubkey_auth: meshcore        # must match the MeshCore adapter's 'name' above
#     private_key: ""              # leave blank if serial (auto); paste 128-hex for TCP
#     token_ttl: 3600              # JWT lifetime (seconds); reconnects before expiry
#     topics:
#       - "meshcore/+/+/packets"
#       - "meshcore/+/+/status"
#
#   - type: mqtt
#     name: letsmesh-eu
#     host: mqtt-eu-v1.letsmesh.net
#     port: 443
#     tls: true
#     transport: websockets
#     pubkey_auth: meshcore
#     private_key: ""
#     topics:
#       - "meshcore/+/+/packets"
#
# ── LetsMesh packet comparison (optional, separate from the mqtt entries above) ──
# Subscribing to the packets topic with a plain `mqtt` adapter (above) would dump
# every observed packet into the message feed as noisy generic-JSON messages —
# use `letsmesh_compare` instead: it merges path/routing data reported by other
# LetsMesh observers into this station's MeshCore adapter's topology graph (same
# graph traces/map routing use) and logs a coverage summary, without adding
# anything to the feed. Scope the topic to your region — check the analyzer map
# (analyzer.letsmesh.net) for the region code near you (e.g. RKD).
#
#   - type: letsmesh_compare
#     name: letsmesh-compare
#     host: mqtt-us-v1.letsmesh.net
#     port: 443
#     tls: true
#     transport: websockets
#     pubkey_auth: meshcore        # same MeshCore adapter as the letsmesh-us entry above
#     meshcore_adapter: meshcore   # which local MeshCore adapter to feed topology into
#     private_key: ""              # leave blank if serial (auto); paste 128-hex for TCP
#     topics:
#       - "meshcore/RKD/+/packets" # region-scoped — swap RKD for your region
# ── Meshtastic public MQTT ────────────────────────────────────────────────────
#   - type: mqtt
#     name: meshtastic-public
#     host: mqtt.meshtastic.org
#     port: 1883
#     topics:
#       - "msh/US/ME/#"          # adjust region/channel filter as needed
#
# ── Local mosquitto broker ────────────────────────────────────────────────────
#   - type: mqtt
#     name: local-mqtt
#     host: localhost
#     port: 1883
#     username: subscriber       # omit for anonymous
#     password: changeme
#     topics:
#       - "meshcore/#"
#       - "meshtastic/#"
#     publish_topic: "ech/alerts"
#
# ── Generic broker (username/password) ───────────────────────────────────────
#   - type: mqtt
#     name: my-broker
#     host: broker.example.com
#     port: 1883
#     username: user
#     password: pass
#     tls: false
#     transport: tcp             # tcp (default) | websockets
#     client_id: ech-node        # default: ech-{name}
#     keepalive: 60
#     qos: 0
#     topics:
#       - "#"
#     publish_topic: "ech/outbound"

# ── Meshtastic (real hardware) ────────────────────────────────────────────────
#
# USB serial:
#   - type: meshtastic
#     name: meshtastic-usb
#     transport: serial
#     port: /dev/ttyUSB0        # or null for auto-detect
#     channel_idx: 0
#     channel_name: "LongFast"  # optional: use this named channel for TX
#
# TCP/WiFi:
#   - type: meshtastic
#     name: meshtastic-wifi
#     transport: tcp
#     host: 192.168.1.100
#     channel_idx: 0
#
# Browser-hosted (radio plugged into the OPERATOR'S computer, not the server —
# open /remote-hw in that browser and connect it via Web Serial; name below
# must match the adapter name entered there):
#   - type: meshtastic
#     name: meshtastic-remote
#     transport: browser
#     channel_idx: 0
#
# LoRa / GPS can be configured live from the Settings page after connecting.
# On first use, set region (e.g. US) and modem preset (e.g. LongFast) so the
# device is on the correct band.  Enable GPS (ublox / built-in) for time sync
# and automatic position reporting.  These write to device flash via the
# Meshtastic Admin API and persist across reboots.

# ── APRS (real hardware) ──────────────────────────────────────────────────────
#
# APRS-IS internet:
#   - type: aprs_is
#     name: aprs-internet
#     callsign: N0CALL-9
#     passcode: 12345            # -1 for receive-only
#     server: rotate.aprs2.net
#     filter: "r/44.1/-69.1/60"   # radius in km — keep this tight; a wide radius (e.g. 250km)
#                                  # pulls in the whole region's ship-AIS/digipeater/beacon
#                                  # firehose (observed: 8000+ msgs/day at 250km vs local need)
#
# CW / Morse code over a sound card (built-in, USB, or a rig's USB audio codec):
#   RX decodes transmissions into inbox messages (adaptive speed/pitch/threshold);
#   TX keys text as sidetone audio out the output device — the radio needs VOX
#   (or CAT PTT via rigctld) since this adapter does not key PTT itself.
#   - type: cw_audio
#     name: cw-audio
#     input_device: "USB Audio"  # name substring, device index, or null = default
#     output_device: null        # null with no match = RX only
#     freq: 600                  # expected CW pitch Hz (auto-tunes 300-1200 Hz)
#     auto_tune: true
#     wpm: 20                    # TX keying speed
#
# BROWSER-HOSTED hardware (remote adapters): the device lives on the OPERATOR'S
# computer; the /remote-hw page bridges it to the server over WebSocket.
#   MeshCore node on the operator's USB port:
#   - type: meshcore
#     name: meshcore-remote      # must match the name entered on /remote-hw
#     transport: browser
#   CW decoded from the operator's radio audio:
#   - type: cw_audio
#     name: cw-remote            # must match the name entered on /remote-hw
#     input_device: browser
#
# RTTY over a sound card (45.45 baud Baudot, 2125/2295 Hz, same VOX/PTT note):
#   - type: rtty_audio
#     name: rtty
#     input_device: "USB Audio"
#     freq: 2125                 # mark; space = freq + shift
#     shift: 170
#     baud: 45.45
#
# PSK31 over a sound card (31.25 baud BPSK varicode, same VOX/PTT note):
#   - type: psk31_audio
#     name: psk31
#     input_device: "USB Audio"
#     freq: 1000                 # carrier
#
# FT8/FT4 via WSJT-X (no soundcard needed here — WSJT-X does the DSP and sends
# decodes over UDP; set WSJT-X Settings→Reporting→"UDP Server" to this machine):
#   - type: wsjtx
#     name: ft8
#     host: 0.0.0.0
#     port: 2237                 # WSJT-X default; RX-only
#
# KISS TNC serial (hardware TNC or Direwolf serial):
#   - type: aprs_kiss
#     name: aprs-tnc
#     transport: serial
#     port: /dev/ttyUSB1
#     baud: 9600
#     callsign: N0CALL-9
#     tx_path: WIDE1-1,WIDE2-1
#
# Direwolf KISS over TCP:
#   - type: aprs_kiss
#     name: aprs-direwolf
#     transport: tcp
#     host: localhost
#     tcp_port: 8001             # Direwolf default KISS-over-TCP
#     callsign: N0CALL-9

# ── JS8Call HF (real) ─────────────────────────────────────────────────────────
#   Requires JS8Call running with TCP API enabled on port 2442.
#   - type: js8call
#     name: hf-js8call
#     host: 127.0.0.1
#     port: 2442
#     callsign: N0CALL-9
#     hb_interval: 30
#     rx_activity: false         # true = show all raw band activity (noisy)

# ── SMS modem (real) ──────────────────────────────────────────────────────────
#   Supports SIM800L, SIM7600, Huawei E3372, etc.
#   - type: sms
#     name: sms
#     port: /dev/ttyUSB0         # SIM7600: usually /dev/ttyUSB0
#     baud: 115200
#     pin: "1234"                # omit if no SIM PIN
#     delete_on_read: true
#     poll_interval: 60
#     pdu_mode: false            # true for some Huawei sticks
#   #
#   # Hardware notes:
#   #   SIM7600 HAT:  set port to the AT+SMS port, NOT GPS or diagnostic
#   #   SIM800L GPIO: needs 3.7-4.2V supply separate from Pi 3.3V
#   #   Huawei E3372h: may need usb_modeswitch first:
#   #     sudo apt install usb-modeswitch
#   #     usb_modeswitch -v 12d1 -p 1f01 -J

# ── Pat Winlink (real) ────────────────────────────────────────────────────────
#   Requires Pat running with HTTP API.  Setup:
#     wget https://github.com/la5nta/pat/releases/latest/download/pat_linux_arm64.tar.gz
#     sudo tar -xzf pat_*.tar.gz -C /usr/local/bin/ pat
#     sudo -u ech pat configure     # set callsign and Winlink password
#     sudo systemctl enable --now pat
#
#   - type: pat_winlink
#     name: winlink
#     callsign: N0CALL-9
#     pat_url: http://127.0.0.1:8080
#     poll_interval: 300
#     auto_connect: false
#     connect_alias: telnet          # telnet | ardop | ax25 | vara-hf | vara-fm
#     # RMS gateway discovery is worldwide (1000+ stations) with no inherent
#     # range limit, unlike ADS-B/AIS — set this to keep the map's RMS markers
#     # confined to the same area as everything else, same shape as the
#     # aishub/aisstream adapters' bounding_box. Omit to keep showing all of them.
#     bounding_box: [[43.0, -72.0], [47.0, -65.0]]   # [min_lat, min_lon], [max_lat, max_lon]

# ── Asterisk/PBX (real) ───────────────────────────────────────────────────────
#   Bridges VoIP/PSTN calls with ECH messaging via Asterisk AMI. Requires a
#   manager.conf stanza on the Asterisk box granting these credentials
#   read/write access (call/originate permissions).
#   - type: asterisk
#     name: pbx
#     ami_host: 127.0.0.1
#     ami_port: 5038
#     ami_username: ech
#     ami_secret: changeme
#     local_extension: "101"       # ATA/phone extension for click-to-call source
#     channel_driver: PJSIP        # "PJSIP" (modern default) or "SIP" if this box still runs chan_sip
#     context: from-internal
#     caller_id: "ECH <100>"
#     vm_context: default          # voicemail context; mailboxes are "{ext}@{vm_context}"

# ── AREDN (real) ─────────────────────────────────────────────────────────────
#   Polls AREDN mesh node API for topology and device info.
#   - type: aredn_ami
#     name: aredn
#     host: localnode.local.mesh
#     poll_interval: 60

# ── AX.25 packet BBS (real) ────────────────────────────────────────────────────
#   Classic connected-mode packet BBS mail (W0RLI/FBB/MSYS-style) — NOT Winlink;
#   Winlink over packet is handled by pat_winlink (Pat owns that protocol
#   regardless of transport). Requires the Linux AX.25 stack already configured
#   on this box: ax25-apps installed, ax25 kernel module loaded, a KISS TNC
#   (e.g. Direwolf) kissattach'd to a port defined in /etc/ax25/axports. See
#   ech/adapters/ax25_bbs_adapter.py's module docstring for full setup steps.
#   - type: ax25_bbs
#     name: packet-bbs
#     ax25_port: radio            # port name from /etc/ax25/axports
#     bbs_callsign: "KA1ABC-1"    # target BBS station
#     poll_interval_sec: 1800     # packet is slow — don't poll aggressively
#     # list_command: "L"          # BBS dialect commands — defaults follow the
#     # read_command_fmt: "R {n}"  # common W0RLI convention; adjust if your
#     # bye_command: "B"           # BBS software uses a different command set
#     # send_end_marker: "/EX"

# ── DAPNET pager (real) ──────────────────────────────────────────────────────
#   Decentralized Amateur Paging Network (hampager.de) — send-only, POCSAG
#   pagers can't reply. Requires a DAPNET account (register at hampager.de)
#   and at least one transmitter group covering your area (see "Transmitter
#   Groups" on the DAPNET web UI for the short names). Send by setting the
#   composed message's To field to the recipient's DAPNET callsign.
#   - type: dapnet
#     name: dapnet
#     callsign: N0CALL
#     password: changeme            # DAPNET account password
#     transmitter_groups: ["dl-all"]  # replace with your region's group(s)
#     poll_interval: 300

# ── AREDN mesh chat (real) ────────────────────────────────────────────────────
#   Talks directly to a MeshChat (github.com/kn6plv/meshchat) CGI backend
#   reachable over an AREDN mesh — no new hardware, just points at whatever
#   node/service-computer on the mesh is already running MeshChat. NOT a
#   direct-message system: MeshChat is a shared channel, everyone on it sees
#   every message. NOTE: implemented from MeshChat's source (Aug 2026), not
#   yet live-tested against a real AREDN node — verify against yours before
#   relying on it; see ech/adapters/aredn_meshchat.py's module docstring.
#   - type: aredn_meshchat
#     name: aredn-chat
#     base_url: http://localnode.local.mesh/cgi-bin/meshchat
#     call_sign: N0CALL
#     channel: ""                   # blank = server's default_channel
#     poll_interval: 30

# ── M17 reflector (real) ──────────────────────────────────────────────────────
#   Software-only text messaging over an M17 reflector's UDP "Internet
#   Interface" — no radio hardware needed. NOTE: implemented from protocol
#   docs + reference reflector source (Aug 2026), NOT yet live-tested against
#   a real reflector — verify before relying on it; see the "Known unverified
#   assumptions" list in ech/adapters/m17_reflector.py's module docstring
#   (BROADCAST address convention, TYPE field bits, and the exact wire
#   encoding of listen-only mode are all best-effort, not confirmed).
#   - type: m17_reflector
#     name: m17
#     reflector_host: m17.example.net   # pick a reflector: m17.hblink.network, etc.
#     reflector_port: 17000
#     module: "M"                      # single letter A-Z — the "room" to join
#     callsign: N0CALL
#     listen_only: false

# ── DMR / BrandMeister (real) ──────────────────────────────────────────────────
#   Homebrew/DMRplus Repeater Protocol over UDP — no radio hardware needed,
#   connects as a software "repeater" the same way a hotspot does. STATUS:
#   connection layer + SMS codec are both real and live-tested against a
#   private hblink3 test master, including a real over-the-wire send/receive
#   round trip (2026-08-16, see ECH_REQUIREMENTS_AND_PROGRESS.md's DMR
#   section) — but NOT verified against real DMR hardware (no radio with
#   working SMS support was available to test with). Test against a private
#   hblink3 master before ever pointing this at a real network — see
#   ech/adapters/dmr_brandmeister.py's module docstring.
#   - type: dmr_brandmeister
#     name: dmr
#     master_host: 192.168.6.38        # your hblink3 test master, or a real DMR master
#     master_port: 54000
#     passphrase: echdmrtest2026
#     radio_id: 3129999                # repeater-level DMR ID, not a personal one
#     callsign: N0CALL
#     sms_format: etsi_be              # etsi_be (the standard) or motorola (what
#                                       # common hardware, e.g. AnyTone, often expects)

# ── Bridge rules (optional) ───────────────────────────────────────────────────
# Forward messages from one adapter's output to another's send().
# bridge_rules:
#   - from_adapter: meshcore
#     to_adapter: letsmesh-us
#   - from_adapter: aprs-internet
#     to_adapter: meshtastic-usb

# ── MeshCore → MQTT bridge (legacy internal bridge) ──────────────────────────
# This is the older bridge implemented in meshcore_bridge.py.
# For most setups, prefer the mqtt adapter above with pubkey_auth instead.
# Keep enabled: false unless you specifically need the internal bridge.
meshcore_bridge:
  enabled: false
  mqtt_host: localhost
  mqtt_port: 1883
  # mqtt_username: subscriber
  # mqtt_password: changeme
  topic_prefix: meshcore
  adapter_name: meshcore        # which MeshCore adapter to mirror (null = auto)
  iata_code: "XXX"              # 3-letter IATA airport code for your region
  publish_decoded: true
  qos: 0

# ── Mesh bot ──────────────────────────────────────────────────────────────────
# General-purpose bot: ping, weather, overhead, satpass, solar/space, help.
# All commands share the same channel list and cooldown settings.
# No API key required for any command.  Requires: pip install skyfield
#
# Commands:
#   ping              — echo with SNR/hop metadata
#   weather <zip5>    — NWS current conditions + forecast (US zip codes)
#   overhead          — closest aircraft from dump1090 JSON within radius
#   satpass [name]    — next ISS / NOAA satellite pass (requires lat/lon)
#   solar / space     — SFI, SSN, K-index from hamqsl.com
#   help              — list commands
mesh_bot:
  enabled: true
  channels: ["ch0", "ch2", "ch4"] # ch0=Public, ch2=#echbot (bot test channel), ch4=MaineNet
  mention_required_channels: ["ch0", "ch4"] # even a real command word needs @mention here — ch2/#echbot is exempt (dedicated bot-test channel)
  adapters: []                  # [] = all adapters; e.g. ["meshcore-1"]
  reply_dm: true                # true = DM sender; false = channel broadcast
  per_user_cooldown_sec: 5      # per-sender cooldown shared across all commands
  global_cooldown_sec: 2        # minimum gap between any two bot replies (flood guard)
  max_reply_len: 160            # hard cap — keeps reply within one LoRa payload
  mention_name: "[ECH Bot]"     # @name that triggers an "unrecognized command" reply on channels (DMs always get one) — matches "@[ECH Bot]"
  # skywarn_winlink_to: ""      # email or Winlink callsign "skywarn winlink" sends the last report to
                                 # (a served agency/EOC/liaison you've actually arranged — never a
                                 # hardcoded NWS address, since no verified official inbox exists).
                                 # Requires a connected pat_winlink adapter. Unset = command disabled.

  # Observer coordinates — used by overhead, satpass, and weather without a zip.
  # Falls back to weather_service.nws_lat / nws_lon if not set here.
  lat: null
  lon: null

  # Aircraft overhead (dump1090 / readsb)
  dump1090_path: "/run/dump1090-fa/aircraft.json"
  overhead_radius_nm: 20        # nautical miles

  # Satellite passes (skyfield)
  tle_targets: ["ISS (ZARYA)", "NOAA 19", "NOAA 18"]

  # Solar / space weather (hamqsl.com — no key needed)
  solar_cache_sec: 900          # re-fetch after 15 minutes

  # Marine/boating conditions (NDBC buoy — no key needed). Find a station at
  # ndbc.noaa.gov. Powers the "marine"/"boating"/"buoy"/"kayak" command.
  # ndbc_station: "44007"
  # ndbc_lat: null              # optional — for a map marker at the buoy location
  # ndbc_lon: null

# weather_bot key is still accepted as an alias for mesh_bot (backwards compat)

# ── Air quality / wildfire smoke (AirNow AQI + NASA FIRMS + NOAA HMS smoke) ───
# Powers the mesh bot's "smoke"/"aqi" command and the map's 🔥 AQI layer
# (real AirNow monitor stations + fire hotspots + actual smoke-plume polygons,
# so smoke drifting in from a fire hundreds of miles away — e.g. Canada — still
# shows up even though FIRMS itself only reports point fire detections).
# Disabled by default — needs API keys for the sources you want:
#   AirNow:      https://docs.airnowapi.org/  (current AQI + station coverage — required)
#   NASA FIRMS:  https://firms.modaps.eosdis.nasa.gov/api/area/  (fire hotspots — optional)
#   PurpleAir:   https://develop.purpleair.com/  (denser crowd-sourced sensors — optional;
#                raw/uncorrected PM2.5, converted to AQI here via EPA breakpoints)
#   NOAA HMS smoke plumes — no key needed, always polled if enabled.
# All fields below except `enabled` are also editable live from Settings (no
# restart needed) — this block is only the first-install default.
# air_quality_service:
#   enabled: true
#   airnow_api_key: ""            # required for AQI data
#   firms_api_key: ""             # optional — omit to skip fire-hotspot lookup
#   purpleair_api_key: ""         # optional — omit to skip the denser sensor layer
#   lat: null                     # falls back to weather_service.nws_lat/lon
#   lon: null
#   poll_interval_sec: 1800       # 30 min — AirNow stations update roughly hourly
#   station_bbox_deg: 4            # AirNow station search box (degrees, ~275mi) — 1 API call
#   smoke_bbox_deg: 15             # HMS smoke-plume search box (degrees) — plumes travel far
#   fire_bbox_deg: 15              # FIRMS search box (degrees) — matches smoke_bbox_deg by default
#                                   # so a fire producing visible smoke isn't outside the fire search
#   firms_source: "VIIRS_SNPP_NRT"
#   firms_dayrange: 2              # satellite passes can miss a fire on any single day (cloud cover)
#   # Auto-broadcast to mesh when AQI worsens into one of these categories —
#   # empty list (default) disables auto-broadcast; manual "Share air quality"
#   # button on the dashboard works regardless of this setting.
#   auto_broadcast_categories: []   # e.g. ["Unhealthy", "Very Unhealthy", "Hazardous"]
#   auto_broadcast_adapters: []     # blank = all connected adapters
#   auto_broadcast_channel: ""      # channel name, e.g. "smoke" — blank = adapter default
#   auto_broadcast_min_interval_sec: 1800
#   auto_broadcast_category_cooldown_sec: 3600
#   auto_broadcast_max_per_hour: 2

# ── POTA proximity alerts (Parks on the Air) ──────────────────────────────────
# Polls the same public activator-spot feed the map's 🏞 POTA layer uses
# (api.pota.app — no key needed) and posts newly-detected nearby activations
# to the mesh, e.g. a "pota" MeshCore channel. "Nearby" is a radius around the
# base position, the same convention the map's on-demand POTA overlay already
# uses — POTA's spot API has no bounding-box query, only radius filtering.
# Disabled by default (opt-in — this posts external hobby data to your mesh).
# All fields below except `enabled` are also editable live from Settings.
# pota_service:
#   enabled: true
#   lat: null                      # falls back to weather_service.nws_lat/lon
#   lon: null
#   radius_km: 500
#   poll_interval_sec: 300
#   seen_ttl_sec: 21600             # 6h — re-announces the same park after this long idle
#   auto_broadcast_adapters: []     # blank = all connected adapters
#   auto_broadcast_channel: "pota"  # channel name — blank = adapter default
#   auto_broadcast_min_interval_sec: 120
#   auto_broadcast_max_per_hour: 10

# ── Named water bodies (EPA ATTAINS water quality + nearest live NDBC buoy) ───
# Auto-discovers every EPA-assessed lake/bay/estuary/river near the hub — no
# manual buoy-picking needed. Powers the mesh bot's "marine <name>"/"fish <name>"/
# "water" commands and per-water-body map markers. No API key needed — both EPA
# ATTAINS (gispub.epa.gov) and NOAA NDBC's global buoy snapshot are public.
# Most lakes/rivers have no live buoy nearby — that's reported explicitly
# (water quality status only) rather than silently omitted.
# All fields below except `enabled` are also editable live from Settings.
# water_body_service:
#   enabled: true
#   lat: null                      # falls back to weather_service.nws_lat/lon
#   lon: null
#   bbox_deg: 0.75                 # discovery search box (degrees, ~50mi) around the hub
#   buoy_match_max_mi: 60          # max distance to match a water body to a live buoy
#   poll_interval_sec: 21600       # 6h — EPA assessment status changes slowly

# ── MeshMapper Coverage API (community RF coverage — BIDIR/TX/RX/DISC/DEAD/DROP) ──
# Diagnoses one-way ("I hear them, they don't hear me") links by checking whether
# the hub's own grid square is a confirmed two-way (BIDIR) link in aggregated
# community coverage data. Requires a region-scoped API key from a MeshMapper
# regional administrator (https://wiki.meshmapper.net/coverage-api/) — 100
# requests/day limit, so keep poll_interval_sec well above 864 (86400/100).
# All fields below except `enabled`/`api_key` are also editable live from Settings.
# meshmapper_coverage:
#   enabled: true
#   api_key: YOUR_MESHMAPPER_KEY    # NEVER commit a real key — set only in the live config
#   lat: null                       # falls back to weather_service.nws_lat/lon
#   lon: null
#   poll_interval_sec: 1800         # 30 min = 48 requests/day

# ── meshcore-hub gap comparison (O96) ─────────────────────────────────────────
# Read-only: compares group/channel text messages a self-hosted meshcore-hub
# instance's OTHER observers heard against ECH's own message log, to surface
# reception gaps ("other observers heard this, we didn't"). Requires running
# your own meshcore-hub instance (github.com/ipnet-mesh/meshcore-hub) — there
# is no public shared instance. See ech/core/meshcore_hub_compare.py's module
# docstring: the comparison heuristic and the hub's response field names were
# NOT verified against a live instance — treat results as best-effort until
# checked against your own deployment.
# meshcore_hub:
#   enabled: true
#   base_url: "http://meshcore-hub.local:8000"   # your instance, no trailing slash
#   bearer_token: ""                              # only if your instance requires auth

# ── HamVOIP/AllStarLink + AREDN directory (O98) ───────────────────────────────
# A handful of confirmed-real HamVOIP/AllStarLink test/parrot nodes ship
# built in (see ech/core/radio_directory.py) — no "group"/hub or "music" node
# numbers ship built in, since no specific, durable, confirmed-real public one
# was found, and a wrong node silently rings a stranger. AREDN has NO built-in
# entries at all: AREDN addresses are private to each physical mesh with no
# universal directory. Add your own known-good entries here; each needs
# name/destination/description at minimum (destination = node number for
# hamvoip_entries, used directly by the existing click-to-call/originate()
# path; for aredn_entries it's just a reference string shown in the UI, not
# dialable).
# radio_directory:
#   hamvoip_entries:
#     - name: "Local ARES net hub"
#       destination: "12345"
#       category: group
#       description: "Our county ARES Tuesday net control hub"
#   aredn_entries:
#     - name: "Regional AREDN gateway"
#       destination: "n0call-gw.local.mesh"
#       description: "Main regional AREDN tunnel/gateway node"

# ── CAT radio control (rigctld / Hamlib) ──────────────────────────────────────
# ECH connects to a running rigctld process over TCP and polls freq/mode every
# poll_interval seconds. Changes are broadcast to all browsers as cat_update
# WebSocket events so the ham log auto-fills frequency, band, and mode.
#
# rigctld setup (run before starting ECH):
#   Xiegu G90  (CI-V, 19200): rigctld -m 3083 -r /dev/ttyUSB0 -s 19200 -t 4532
#   Icom IC-7300 (9600):      rigctld -m 3073 -r /dev/ttyUSB0 -s 9600 -t 4532
#   Icom IC-705:              rigctld -m 3085 -r /dev/ttyUSB0 -t 4532
#   Icom IC-9700:             rigctld -m 3081 -r /dev/ttyUSB0 -t 4532
#   Yaesu FT-991A (38400):    rigctld -m 1035 -r /dev/ttyUSB0 -s 38400 -t 4532
#   Yaesu FT-817/818 (9600):  rigctld -m 1039 -r /dev/ttyUSB0 -s 9600 -t 4532
#   Yaesu FT-DX10 (38400):    rigctld -m 1043 -r /dev/ttyUSB0 -s 38400 -t 4532
#   Dummy (no hardware):      rigctld -m 1 -t 4532
#
#   Install: sudo apt install libhamlib-utils
#   Find rig model number: rigctl -l | grep -i "xiegu\|icom\|yaesu"
cat:
  enabled: false              # set true after rigctld is running
  rigctld_host: localhost
  rigctld_port: 4532
  poll_interval: 2.0          # seconds between freq/mode polls
  auto_fill_hamlog: true      # push updates to ham log via WebSocket
