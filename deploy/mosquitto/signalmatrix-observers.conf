# SignalMatrix observer broker (O118) — Mosquitto 2.x drop-in for /etc/mosquitto/conf.d/
#
# Lets OTHER operators' MeshCore observers (meshcore-packet-capture etc.) report
# packets to YOUR broker in the same topic layout LetsMesh uses:
#     meshcore/<REGION>/<OBSERVER PUBKEY>/packets
# so path/coverage comparison doesn't depend on access to LetsMesh.
#
# Installed by:  sudo scripts/observer_broker.sh install
# Nothing here is reachable from outside this machine until YOU enable one of
# the external listeners at the bottom (see README: "Your own observer broker").

per_listener_settings true

# Local clients on this box keep working exactly as before (Mosquitto 2.x's
# default is a loopback-only listener on 1883 that allows anonymous clients).
listener 1883 127.0.0.1
allow_anonymous true

# Observers: login required; each observer may publish ONLY under its own
# public key (see signalmatrix.acl); SignalMatrix is the only reader.
listener 1884 127.0.0.1
allow_anonymous false
password_file /etc/mosquitto/signalmatrix_passwd
acl_file /etc/mosquitto/signalmatrix.acl
max_packet_size 65536

# ── External access — DISABLED. Pick one, then: sudo systemctl restart mosquitto ──
# (a) MQTT over TLS on 8883 (forward TCP 8883 on your router):
#listener 8883
#certfile /etc/mosquitto/certs/fullchain.pem
#keyfile /etc/mosquitto/certs/privkey.pem
#allow_anonymous false
#password_file /etc/mosquitto/signalmatrix_passwd
#acl_file /etc/mosquitto/signalmatrix.acl
#max_packet_size 65536
#
# (b) MQTT over WebSocket on 9001, published through Caddy on 443 (observers
#     behind restrictive networks) — Caddy: reverse_proxy /mqtt 127.0.0.1:9001
#listener 9001 127.0.0.1
#protocol websockets
#allow_anonymous false
#password_file /etc/mosquitto/signalmatrix_passwd
#acl_file /etc/mosquitto/signalmatrix.acl
#max_packet_size 65536
