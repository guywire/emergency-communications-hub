[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ech"
version = "0.1.0"
description = "Emergency Communications Hub — unified messaging bridge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "pyserial>=3.5",
    "pyserial-asyncio-fast>=1.0",
    "aprslib>=0.7",
    "meshtastic>=2.3",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "aiomqtt>=2.3",
    "bcrypt>=4.1",
    "psutil>=5.9",
    "smspdudecoder>=1.1",
    "adventure>=1.7",
    "sounddevice>=0.4",
    "numpy<2",                    # CW/RTTY/PSK31 DSP — pinned <2 for SSE2-only ARM/older CPUs (numpy>=2 needs AVX2)
    "pycryptodome>=3.20",         # MeshCore channel-key AES decrypt (falls back to `cryptography` if absent)
    "skyfield>=1.49",             # mesh bot `satpass` command
    "rns>=0.8",                   # Reticulum adapter
    "lxmf>=0.5",                  # Reticulum adapter
    "mgrs>=1.5",                  # mesh bot 'strip' command — lat/lon to MGRS grid reference
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "croniter>=2.0",
    "aiomqtt>=2.3",
    "bcrypt>=4.1",
    "psutil>=5.9",
    "smspdudecoder>=1.1",
]

[project.scripts]
ech = "ech.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ech*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
